; Serge Dashboard — ESP32-S3 telemetry dash for 2-stroke prototype
; Board : Waveshare ESP32-S3-Touch-AMOLED-2.16 (ESP32-S3R8, 8 MB PSRAM, 16 MB flash)

[platformio]
default_envs = serge216

[env:serge216]
; Fork pioarduino : core Arduino-ESP32 3.x (requis par la lib GFX + PMU + BLE S3).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl@8.4.0
    moononournation/GFX Library for Arduino@1.6.4
    lewisxhe/SensorLib@0.3.3
    lewisxhe/XPowersLib@0.2.6
    mikalhart/TinyGPSPlus@1.0.3
    # MAX6675 : driver SPI logiciel integré (src/sensors/egt.cpp), pas de lib externe

monitor_speed = 115200
upload_speed = 921600
